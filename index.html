<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consulta de Documentos</title>

<style>
body {
  font-family: Arial;
  background: #f5f5f5;
  text-align: center;
  padding: 40px;
}

.card {
  background: white;
  padding: 25px;
  border-radius: 12px;
  max-width: 420px;
  margin: auto;
  box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

input {
  padding: 12px;
  width: 80%;
  margin: 10px 0;
  font-size: 16px;
}

button {
  padding: 12px 20px;
  background: #1a73e8;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

table {
  width: 100%;
  margin-top: 20px;
  border-collapse: collapse;
}

td, th {
  padding: 10px;
  border-bottom: 1px solid #ddd;
}

th {
  background: #eee;
}

.pendente {
  color: red;
  font-weight: bold;
}

.erro {
  color: red;
  font-weight: bold;
  margin-top: 15px;
}

.rodape {
  margin-top: 25px;
  text-align: left;
  font-size: 13px;
  background: #fafafa;
  padding: 15px;
  border-radius: 8px;
}

.centralizado {
  text-align: center;
  margin-top: 15px;
}

.guia-btn {
  display: inline-block;
  padding: 12px 18px;
  background: #34a853;
  color: white;
  text-decoration: none;
  border-radius: 6px;
  font-weight: bold;
}

.aviso {
  font-size: 13px;
  color: #555;
  background: #eef4ff;
  border: 1px solid #cfe0ff;
  border-radius: 8px;
  padding: 10px 12px;
  margin: 10px 0 15px 0;
  text-align: left;
}
</style>
</head>

<body>

<div class="card">
  <h2>Centro Universitário Fundação de Ensino Octávio Bastos - UNIFEOB</h2>
  <p>Consulta de Documentos Pendentes para Veteranos</p>

  <p class="aviso">
    Você pode pesquisar pelo seu <strong>RA</strong>, <strong>CPF</strong> (com ou sem pontuação) ou <strong>Nome completo</strong>.
  </p>

  <input id="busca" placeholder="Digite seu RA, CPF ou Nome completo">
  <br>
  <button onclick="consultar()">Consultar</button>

  <div id="resultado"></div>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbz_0L_6CO0pdqDaVqDc4H2mmEzlEMSD_xPA8xVWisUW3cs6TPJbDcTBRx5GTFwBdPUK/exec";

const LINK_GUIA = "https://drive.google.com/file/d/1S8Tpwubt-P0L84ADLuAf9dBf4aLe_8M5/view";

function montarRodape() {
  return `
    <div class="rodape">

      <div class="centralizado">
        <strong>Quer saber como enviar os documentos?</strong><br><br>
        <a href="${LINK_GUIA}" target="_blank" class="guia-btn">
          📄 Ver passo a passo
        </a>
      </div>

      <br><br>

      <strong>Observações importantes:</strong><br><br>

      • Ingresso por vestibular/ENEM: apresentar apenas o Histórico do Ensino Médio.<br><br>

      • Ingresso por transferência: apresentar o Histórico do Ensino Médio + Histórico da instituição de origem.<br><br>

      • Ingresso por 2ª graduação: apresentar o Diploma do Ensino Superior + Histórico do Ensino Superior.

    </div>
  `;
}

function consultar() {
  const busca = document.getElementById("busca").value.trim();

  if (!busca) {
    alert("Digite seu RA, CPF ou Nome completo");
    return;
  }

  document.getElementById("resultado").innerHTML = "Carregando...";

  fetch(API + "?busca=" + encodeURIComponent(busca))
    .then(res => {
      if (!res.ok) throw new Error("Erro na API");
      return res.json();
    })
    .then(data => {

      let html = "";

      // 🔴 CASO ERRO
      if (data.erro) {
        html += `<p class="erro">${data.erro}</p>`;
        html += montarRodape(); // 👈 AGORA SEMPRE MOSTRA
        document.getElementById("resultado").innerHTML = html;
        return;
      }

      html += `
        <p><strong>RA:</strong> ${data.ra}</p>
        <p><strong>Nome:</strong> ${data.nome || ""}</p>
        <p><strong>Curso:</strong> ${data.curso}</p>
      `;

      if (!data.pendencias || data.pendencias.length === 0) {
        html += `<p style="color:green;"><strong>✅ Nenhuma pendência</strong></p>`;
      } else {
        html += `<p class="pendente">⚠️ Pendências encontradas:</p>`;
        html += `<table>
          <tr><th>Documento</th><th>Status</th></tr>
        `;

        data.pendencias.forEach(d => {
          html += `<tr>
            <td>${d.nome}</td>
            <td class="pendente">${d.status}</td>
          </tr>`;
        });

        html += `</table>`;
      }

      // 🔥 RODAPÉ SEMPRE
      html += montarRodape();

      document.getElementById("resultado").innerHTML = html;
    })
    .catch(err => {
      document.getElementById("resultado").innerHTML =
        "<p class='erro'>Erro ao consultar. Verifique a API.</p>";
      console.error(err);
    });
}
</script>

</body>
</html>
